<style>
:root{
  --petrol-900:#03222a; --petrol-800:#06303a; --petrol-700:#0b4250; --petrol-600:#14596a; --petrol-400:#3f8291;
  --yellow:#ffd200; --yellow-soft:#ffe680; --glow:#c9e46c;
  --text:#ffffff; --text-2:rgba(255,255,255,.78); --text-3:rgba(255,255,255,.56);
  --card:rgba(255,255,255,.07); --card-2:rgba(255,255,255,.04); --line:rgba(255,255,255,.14);
  --radius:16px; --font-head:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--petrol-800);color:var(--text);font:16px/1.45 var(--font-body);min-height:100vh}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:var(--yellow-soft)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;padding:calc(28px + env(safe-area-inset-top)) 0 0;text-align:center;
  background:radial-gradient(90% 70% at 50% 18%, #2c6b78 0%, rgba(6,48,58,0) 70%) var(--petrol-800)}
.hero .wrap{position:relative;z-index:1}
.langrow{position:relative;z-index:1;display:flex;justify-content:flex-end;padding:0 16px 14px;max-width:680px;margin:0 auto}
.lang{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);
  border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font:600 13px var(--font-head);
  letter-spacing:.04em;color:var(--text-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--yellow);color:var(--petrol-900)}
.logo{width:64px;height:auto;margin:6px auto 40px}
.title{width:min(330px,82%);margin:0 auto}
.groupchip{display:inline-flex;align-items:center;gap:14px;margin-top:30px;padding:9px 9px 9px 22px;text-align:left;
  border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);font:600 14px/1.25 var(--font-head);color:var(--text-2)}
.groupchip > span{display:flex;flex-direction:column}
.groupchip span strong{font:700 17px var(--font-head);color:var(--text)}
.groupchip b{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 12px;border-radius:999px;
  background:var(--yellow);color:var(--petrol-900);font:800 18px var(--font-head)}

.langrow{padding-top:clamp(80px,20vw,140px)}

/* ---------- Tabs ---------- */
.tabs{position:sticky;top:0;z-index:5;background:rgba(3,34,42,.86);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding-top:8px;padding-bottom:8px}
.tab{border:1px solid transparent;background:transparent;border-radius:12px;padding:8px 4px;cursor:pointer;
  font:700 15px var(--font-head);color:var(--text-2);line-height:1.15}
.tab small{display:block;font:500 11.5px var(--font-body);color:var(--text-3);margin-top:2px}
.tab[aria-selected="true"]{background:var(--card);border-color:var(--line);color:var(--text);box-shadow:inset 0 -3px 0 var(--yellow)}

/* ---------- Day ---------- */
section[hidden]{display:none}
.intro{margin:26px 0 34px;color:var(--text-2);font-size:15px}
.timeline{list-style:none;margin:0 0 28px;padding:0;position:relative}
.timeline:before{content:"";position:absolute;left:58px;top:8px;bottom:8px;width:2px;background:var(--line)}
.it{display:grid;grid-template-columns:50px 1fr;gap:18px;margin:0 0 18px;position:relative}
.it:before{content:"";position:absolute;left:54px;top:15px;width:10px;height:10px;border-radius:50%;
  background:var(--petrol-400);box-shadow:0 0 0 3px var(--petrol-900)}
.time{font:700 15px var(--font-head);text-align:right;padding-top:9px;font-variant-numeric:tabular-nums}
.time span{display:block;font:500 12px var(--font-body);color:var(--text-3);margin-top:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 13px}
.label{font:600 11.5px var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--yellow-soft);margin-bottom:4px}
.label span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.label .topic{flex:none;padding:2px 7px;border-radius:999px;border:1px solid rgba(255,230,128,.45);font-size:10.5px;letter-spacing:.04em}
.card{position:relative}
.nowslot{position:absolute;top:-10px;right:12px}
.card h3{margin:0;font:700 17px/1.25 var(--font-head)}
.part + .part{margin-top:8px}
.spk{display:flex;gap:6px;align-items:flex-start;margin-top:4px;color:var(--text-2);font-size:14.5px}
.spk svg{flex:none;margin-top:3px;opacity:.8}
.where{display:inline-flex;align-items:flex-start;gap:6px;margin-top:9px;padding:5px 10px 5px 8px;border-radius:10px;
  border:1px solid var(--line);background:rgba(0,0,0,.18);font-size:13.5px;color:var(--text);text-align:left;cursor:pointer}
.where svg{flex:none;margin-top:2px;color:var(--yellow)}
.note{margin:9px 0 0;color:var(--text-2);font-size:14.5px}
.k-session .card,.k-highlight .card{background:linear-gradient(135deg,rgba(255,210,0,.16),rgba(255,255,255,.06));border-color:rgba(255,210,0,.35)}
.k-session:before,.k-highlight:before{background:var(--yellow)}
.k-break .card,.k-move .card{background:var(--card-2);border-style:dashed;padding:9px 12px 10px}
.k-break h3,.k-move h3{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.k-break h3 svg,.k-move h3 svg{flex:none;color:var(--glow)}
.k-break .note,.k-move .note{font-size:14px;margin-top:5px}
.k-break .where,.k-move .where{margin-top:7px}
.it.now .card{box-shadow:0 0 0 2px var(--yellow),0 8px 28px rgba(255,210,0,.18)}
.it.now:before{background:var(--yellow);box-shadow:0 0 0 3px var(--petrol-900),0 0 0 7px rgba(255,210,0,.35)}
.nowtag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--yellow);color:var(--petrol-900);
  font:800 10.5px var(--font-head);letter-spacing:.08em;text-transform:uppercase;vertical-align:2px}
.it.past{opacity:.55}

/* ---------- Locations ---------- */
.loc-h{margin:26px 0 4px;font:800 22px var(--font-head)}
.bldg{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:16px 0 22px}
.bldg-head{padding:16px 16px 14px}
.bldg-head .sub{font:600 12px var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--yellow-soft)}
.bldg-head h3{margin:4px 0 2px;font:800 20px/1.2 var(--font-head)}
.addr{color:var(--text-2);font-size:14.5px}
.btn{display:inline-flex;align-items:center;gap:7px;margin:10px 8px 0 0;padding:8px 13px;border-radius:999px;
  background:var(--yellow);color:var(--petrol-900);font:700 13.5px var(--font-head);text-decoration:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.iso{background:#f4f1ec;padding:12px 8px}
.iso img{margin:0 auto;width:100%;max-width:560px}
.room{border-top:1px solid var(--line);scroll-margin-top:80px}
.room.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:rgba(255,210,0,.18)}100%{background:transparent}}
.room img.photo{width:100%;aspect-ratio:5/2;object-fit:cover}
.room-body{padding:12px 16px 16px}
.room-body h4{margin:0;font:700 17px var(--font-head);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.room-body h4 span{font:600 13px var(--font-body);color:var(--text-3);white-space:nowrap}
.room-body p{margin:5px 0 0;color:var(--text-2);font-size:14.5px}
.foryou{margin:11px 0 0;padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.2);font-size:14px}
.foryou b{display:block;font:700 11px var(--font-head);letter-spacing:.07em;text-transform:uppercase;color:var(--glow);margin-bottom:4px}
.foryou div{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:2px 0}
.foryou div span:first-child{color:var(--text-3);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.duo figure{margin:0;background:var(--petrol-800)}
.duo img{width:100%;height:190px;object-fit:cover}
.cap{padding:10px 16px;font-size:13.5px;color:var(--text-2);border-top:1px solid var(--line)}
.plan{padding:14px 16px 6px;border-top:1px solid var(--line)}
.plan h4{margin:0 0 8px;font:700 15px var(--font-head)}
.planimg{position:relative;max-width:440px;margin:0 auto 12px;border-radius:10px;overflow:hidden}
.planimg img{width:100%}
.mark{position:absolute;border:3px solid #06303a;border-radius:4px;box-shadow:0 0 0 3px rgba(255,255,255,.8);animation:pulse 2s ease-in-out infinite}
.mark span{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);white-space:nowrap;background:#06303a;color:#fff;
  font:800 11px var(--font-head);letter-spacing:.04em;padding:3px 8px;border-radius:999px}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.35)}}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btns .btn{margin:0}
.walkrow{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:14.5px;color:var(--text-2)}
.walkrow svg{color:var(--glow);flex:none}
.walkrow b{color:var(--text);font-family:var(--font-head)}
.hs-photo{position:relative}
.hs-photo img{width:100%;aspect-ratio:16/9;object-fit:cover}
.hs-photo span{position:absolute;left:12px;top:12px;background:var(--yellow);color:var(--petrol-900);
  font:800 13px var(--font-head);padding:5px 10px;border-radius:999px}
.walk{border-top:1px solid var(--line);padding:0 0 16px}
.walk img{width:100%}
.walk .wi{padding:10px 16px 0;display:flex;gap:8px;align-items:center;font:600 14.5px var(--font-head)}
.walk .wi svg{color:var(--glow)}
.walk .btn{margin-left:16px}
.simple{padding:12px 16px;border-top:1px solid var(--line)}

  pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>',
  mic:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  walk:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M7 21l3-7 3 3v5M10 14l1-5 4 3h3M11 9l-3 1-2 4"/></svg>',
  cup:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9zM16 10h2a2.5 2.5 0 0 1 0 5h-2M8 3v3M12 3v3"/></svg>',
  pause:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>',
  map:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>'
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang = 'de', tab = null;

function pickLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'de' || q === 'en') return q;
  try { const s = localStorage.getItem('jd26-lang'); if (s === 'de' || s === 'en') return s; } catch(e){}
  const langs = navigator.languages || [navigator.language || 'de'];
  return String(langs[0] || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
}
function nowDate(){
  const q = new URLSearchParams(location.search).get('now');   // test: ?now=2026-10-15T15:00
  return q ? new Date(q) : new Date();
}
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hm  = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');

function itemHTML(it){
  const d = it[lang], U = DATA.ui[lang];
  const icon = it.kind === 'move' ? ICON.walk : (it.kind === 'break' ? (/Kaffee|Coffee/.test(d.title) ? ICON.cup : ICON.pause) : '');
  let head = '';
  if (d.parts && d.parts.length){
    head = d.parts.map(p => `<div class="part"><h3>${esc(p[0])}</h3>${p[1] ? `<div class="spk">${ICON.mic}<span>${esc(p[1])}</span></div>` : ''}</div>`).join('');
  } else {
    head = `<h3>${icon}<span>${esc(d.title)}</span></h3>` +
           (d.speaker ? `<div class="spk">${ICON.mic}<span>${esc(d.speaker)}</span></div>` : '');
  }
  const where = d.where ? `<button type="button" class="where" data-loc="${esc(it.loc)}" aria-label="${esc(U.toLoc)}: ${esc(d.where)}">${ICON.pin}<span>${esc(d.where)}</span></button>` : '';
  const label = d.label ? `<div class="label">${esc(d.label)}</div>` : '';
  return `<li class="it k-${it.kind}" data-start="${it.start}" data-end="${it.end}">
    <div class="time">${it.start}<span>${it.end}</span></div>
    <div class="card"><span class="nowslot"></span>${label}${head}${where}${d.note ? `<p class="note">${esc(d.note)}</p>` : ''}</div></li>`;
}

function renderDays(){
  DATA.days.forEach(day => {
    document.getElementById(day.id).innerHTML =
      `<p class="intro">${esc(day.intro[lang])}</p><ol class="timeline" data-date="${day.date}">${day.items.map(itemHTML).join('')}</ol>`;
  });
  markNow();
}

function forYou(keys){
  const U = DATA.ui[lang], rows = [];
  DATA.days.forEach((day, i) => day.items.forEach(it => {
    const d = it[lang];
    if (keys.includes(it.loc) && it.kind !== 'move' && !(it.kind === 'break' && !/Kaffee|Coffee/.test(d.title))){
      const t = d.parts && d.parts.length ? d.parts.map(p => p[0]).join(' · ') : d.title;
      rows.push(`<div><span>${i ? U.day2 : U.day1} · ${it.start}</span><span>${esc(t)}</span></div>`);
    }
  }));
  return rows.length ? `<div class="foryou"><b>${esc(U.forYou)}</b>${rows.join('')}</div>` : '';
}

function renderLoc(){
  const U = DATA.ui[lang], L = DATA.loc, I = DATA.img, mine = DATA.sfsRoom;
  const btns = k => `<div class="btns"><a class="btn" href="${L[k].maps}" target="_blank" rel="noopener">${ICON.map}${esc(U.route)}</a>
     <a class="btn" href="${L[k].apple}" target="_blank" rel="noopener">${ICON.map}${esc(U.apple)}</a></div>`;
  const head = (k, extra='') => `<div class="bldg-head"><div class="sub">${esc(L[k][lang].sub)}</div><h3>${esc(L[k][lang].name)}</h3>
     <div class="addr">${esc(L[k].addr)}</div>${btns(k)}${extra}</div>`;
  const floor = f => lang === 'de' ? f + '. OG' : f + 'th floor';

  const ues = `<article class="bldg" id="loc-ues">${head('ues')}
    <div class="iso"><img src="${I.ues_floors}" alt="Wallstreet, High Line Park, Rooftop, Penthouse" loading="lazy"></div>
    ${L.ues.rooms.map(r => `<div class="room" id="loc-${r.key}"><img class="photo" src="${I[r.key]}" alt="${esc(r[lang][0])}" loading="lazy">
      <div class="room-body"><h4>${esc(r[lang][0])}<span>${floor(r.floor)}</span></h4>${forYou([r.key])}</div></div>`).join('')}
  </article>`;

  const ROOMBOX = {1:[51.3,2.2,39.8,15.4], 2:[8.9,2.2,40.2,15.4], 3:[8.9,19.1,20.4,29.6]};
  const box = mine && ROOMBOX[mine];
  const walk = `<div class="walkrow">${ICON.walk}<span><b>${esc(U.walk)}</b> ${esc(U.walkInfo)}</span></div>
    <div class="btns"><a class="btn ghost" href="${L.sfs.walk}" target="_blank" rel="noopener">${esc(U.route)}</a>
    <a class="btn ghost" href="${L.sfs.applewalk}" target="_blank" rel="noopener">${esc(U.apple)}</a></div>`;
  const sfs = `<article class="bldg" id="loc-sfs">${head('sfs', walk)}
    <div class="duo"><figure><img src="${I.sfs_building}" alt="${esc(L.sfs[lang].name)}" loading="lazy"></figure>
      <figure><img src="${I.sfs_entrance}" alt="Amadeus Fire" loading="lazy"></figure></div>
    <div class="cap">${esc(U.entranceCap)}</div>
    <div class="plan"><h4>${esc(U.floorplan)}</h4><div class="planimg"><img src="${I.sfs_plan}" alt="${esc(U.floorplan)}" loading="lazy">
      ${box ? `<div class="mark" style="left:${box[0]}%;top:${box[1]}%;width:${box[2]}%;height:${box[3]}%"><span>${esc(U.yourRoom)}</span></div>` : ''}</div></div>
    ${mine ? `<div class="hs-photo"><img src="${I['hs' + mine]}" alt="" loading="lazy"><span>${esc(U.yourRoom)}: ${lang === 'de' ? 'Hörsaal ' + mine : 'Seminar Room ' + mine}</span></div>` : ''}
    <div class="room-body">${forYou(['sfs'])}</div>
  </article>`;

  const tower = `<article class="bldg" id="loc-tower">${head('tower')}
    ${L.tower.rooms.map(r => `<div class="simple"><h4>${esc(r[lang][0])}</h4><p>${esc(r[lang][1])}</p></div>`).join('')}
    <div class="room-body">${forYou(['tower'])}</div>
  </article>`;

  document.getElementById('loc').innerHTML =
    `<h2 class="loc-h">${esc(U.locTitle)}</h2><p class="intro" style="margin-top:4px">${esc(U.locIntro)}</p>${ues}${sfs}${tower}`;
}

function markNow(){
  const n = nowDate(), today = ymd(n), t = hm(n), U = DATA.ui[lang];
  document.querySelectorAll('.timeline').forEach(ol => {
    const isToday = ol.dataset.date === today;
    ol.querySelectorAll('.it').forEach(li => {
      const on = isToday && li.dataset.start <= t && t < li.dataset.end;
      li.classList.toggle('now', on);
      li.classList.toggle('past', isToday && li.dataset.end <= t);
      const slot = li.querySelector('.nowslot');
      if (slot) slot.innerHTML = on ? `<span class="nowtag">${esc(U.now)}</span>` : '';
    });
  });
}

function setTab(id, scroll){
  tab = id;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  ['day1','day2','loc'].forEach(s => document.getElementById(s).hidden = s !== id);
  if (scroll) window.scrollTo({top: document.querySelector('.tabs').offsetTop, behavior: 'smooth'});
}

function setLang(l){
  lang = l;
  try { localStorage.setItem('jd26-lang', l); } catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = DATA.ui[l][el.dataset.t]);
  document.getElementById('yourAgenda').textContent = DATA.ui[l].your;
  document.getElementById('groupLabel').textContent = DATA.ui[l].group + ' ' + DATA.group;
  document.getElementById('groupName').textContent = DATA.group;
  document.title = 'Juniors Day 2026 · ' + DATA.ui[l].group + ' ' + DATA.group;
  renderDays(); renderLoc();
}

document.addEventListener('click', e => {
  const lb = e.target.closest('.lang button'); if (lb) return setLang(lb.dataset.lang);
  const tb = e.target.closest('.tab'); if (tb) return setTab(tb.dataset.tab, true);
  const w = e.target.closest('.where');
  if (w && w.dataset.loc){
    setTab('loc');
    const k = w.dataset.loc, el = document.getElementById('loc-' + k) || document.getElementById('loc-' + k.split('-')[0]);
    if (el){ el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
});

setLang(pickLang());
setTab(ymd(nowDate()) === '2026-10-16' ? 'day2' : 'day1');
setInterval(markNow, 60000);
</script>
</body>
