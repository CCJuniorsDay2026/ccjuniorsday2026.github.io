<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protocol 16 - Task 2: Verification</title>
  <style>
    :root {
      --bg: #002E3C;
      --bg-deep: #001B24;
      --accent: #FFD700;
      --text: #F1EFED;
      --text-muted: #A0AEAC;
      --border: #537173;
      --danger: #C5000E;
      --success: #008932;
      --panel: rgba(255,255,255,0.04);
      --panel-border: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 15%, #0a4457 0%, var(--bg) 45%, var(--bg-deep) 100%);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .stage { width: 100%; max-width: 480px; text-align: center; }
    .protocol-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .kicker {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .spinner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid rgba(255,215,0,0.2);
      border-top-color: var(--accent);
      margin: 0 auto 22px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text { font-size: 15px; color: var(--text-muted); min-height: 22px; }

    .result-panel {
      display: none;
      margin-top: 6px;
      padding: 20px 22px;
      border-radius: 12px;
      text-align: left;
    }
    .result-panel.show { display: block; }
    .result-panel.success { background: rgba(0,137,50,0.12); border: 1px solid var(--success); }
    .result-panel.error { background: rgba(197,0,14,0.12); border: 1px solid var(--danger); }
    .result-title { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
    .result-panel.success .result-title { color: #6FE39B; }
    .result-panel.error .result-title { color: #FF8A80; }
    .result-body { font-size: 13.5px; line-height: 1.6; color: var(--text); margin: 0; }

    .action-row { text-align: center; margin-top: 26px; }
    .action-btn {
      display: inline-block;
      padding: 14px 40px;
      background: var(--accent);
      color: #1A1500;
      border: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    .action-btn:hover { transform: scale(1.03); }
    .action-btn.hidden { display: none; }
  </style>
  </head>
  <body>
    <div class="stage">
      <div class="protocol-label">Protocol 16</div>
      <div class="kicker">Task 2 &middot; Verification</div>

      <div id="checking">
        <div class="spinner"></div>
        <div class="status-text">Cross-checking your four matches against the case file&hellip;</div>
      </div>

      <div class="result-panel" id="resultPanel">
        <p class="result-title" id="resultTitle"></p>
        <p class="result-body" id="resultBody"></p>
      </div>

      <div class="action-row">
        <a class="action-btn hidden" id="continueLink" href="12_Aufgabe02_Digit2.html">Continue</a>
        <a class="action-btn hidden" id="retryLink" href="07_Aufgabe02_Frage1.html">Back to Match 1</a>
      </div>
    </div>

    <script>
      var CORRECT = {
        q1: 'mittelstandsbank_direkt',
        q2: 'fx_live_trader',
        q3: 'trade_finance_direkt',
        q4: 'loanpilot'
      };

      var API_URL = 'https://script.google.com/macros/s/AKfycbxc0QIIyaYTbGBMyhsUdYD01_AAYyrIsySqgF4rSWHPH8t73wHdP6iGEYUQMc5ImVsZ/exec';
      var team = sessionStorage.getItem('teamNumber');
      if (team) {
        fetch(API_URL, { method: 'POST', body: new URLSearchParams({ team: team, action: 'progress', page: '11', status: 'open' }) });
      }

      function getAnswers() {
        try { return JSON.parse(sessionStorage.getItem('a2_answers')) || {}; }
        catch (e) { return {}; }
      }

      setTimeout(function () {
        var answers = getAnswers();
        var allCorrect = Object.keys(CORRECT).every(function (k) { return answers[k] === CORRECT[k]; });

        document.getElementById('checking').style.display = 'none';
        var panel = document.getElementById('resultPanel');
        var title = document.getElementById('resultTitle');
        var body = document.getElementById('resultBody');

        if (allCorrect) {
          panel.classList.add('show', 'success');
          title.textContent = 'All four match.';
          body.textContent = 'The case file backs up every choice. Something in the system just gave way.';
          document.getElementById('continueLink').classList.remove('hidden');
          if (team) {
            fetch(API_URL, { method: 'POST', body: new URLSearchParams({ team: team, action: 'progress', page: '11', status: 'done' }) });
          }
        } else {
          panel.classList.add('show', 'error');
          title.textContent = 'Not quite.';
          body.textContent = 'At least one of your four matches doesn’t hold up against the case file. Go back and take another look — your earlier picks are still there.';
          document.getElementById('retryLink').classList.remove('hidden');
        }
      }, 1800);
    </script>
  </body>
</html>
