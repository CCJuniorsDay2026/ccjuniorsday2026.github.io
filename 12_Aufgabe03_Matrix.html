<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protocol 16 - Task 3: Sherlock Matrix</title>
  <style>
    :root {
      --cy: #4DE8FF;
      --cy-dim: #1B6E80;
      --bg: #000000;
      --panel: rgba(77,232,255,0.05);
      --panel-border: rgba(77,232,255,0.25);
      --text-muted: #7FB8C4;
      --danger: #C5000E;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--cy);
      font-family: "SF Mono", "Consolas", "Courier New", monospace;
      padding: 22px 28px 30px;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-shadow: 0 0 12px rgba(77,232,255,0.7);
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .target-readout {
      text-align: right;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--text-muted);
    }
    .target-readout .target-val {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 14px rgba(77,232,255,0.9);
      animation: targetPulse 1.6s ease-in-out infinite;
    }
    @keyframes targetPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .grid-cols {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 18px;
      margin-bottom: 16px;
    }
    @media (max-width: 820px) {
      .grid-cols { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 14px 16px;
    }
    .panel-title {
      font-size: 10.5px;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin: 0 0 10px;
    }

    .matrix-svg { width: 100%; height: auto; display: block; }
    .matrix-svg .grid-line { stroke: rgba(77,232,255,0.15); stroke-width: 1; }
    .matrix-svg .axis-label { fill: var(--text-muted); font-size: 9px; font-family: inherit; }
    .matrix-svg .node { fill: var(--cy); opacity: 0.75; }
    .matrix-svg .node.target { fill: #fff; }
    .matrix-svg .target-ring { fill: none; stroke: #fff; stroke-width: 1.4; opacity: 0.8; animation: ringPulse 1.6s ease-out infinite; transform-origin: center; }
    @keyframes ringPulse {
      0% { r: 10; opacity: 0.9; }
      100% { r: 22; opacity: 0; }
    }

    .side-stack { display: flex; flex-direction: column; gap: 14px; }
    .kv-row { display: flex; justify-content: space-between; font-size: 11.5px; padding: 3px 0; border-bottom: 1px dashed rgba(77,232,255,0.12); color: var(--text-muted); }
    .kv-row span:last-child { color: var(--cy); }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; padding: 5px 0; color: var(--text-muted); }
    .toggle-pill { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--panel-border); }
    .toggle-pill.on { color: #001a1f; background: var(--cy); }
    .toggle-pill.off { color: var(--text-muted); }

    .bars-row { display: flex; align-items: flex-end; gap: 4px; height: 46px; margin-top: 8px; }
    .bar { flex: 1; background: linear-gradient(180deg, var(--cy), var(--cy-dim)); border-radius: 2px 2px 0 0; opacity: 0.8; transition: height 0.5s ease; }

    .bottom-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 18px;
    }
    @media (max-width: 820px) {
      .bottom-row { grid-template-columns: 1fr; }
    }
    .log-list { list-style: none; margin: 0; padding: 0; font-size: 10.5px; line-height: 1.9; color: var(--text-muted); max-height: 120px; overflow: hidden; }
    .log-list li span { color: var(--cy); }

    .signal-graph { width: 100%; height: 70px; display: block; }
    .signal-pct { font-size: 26px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(77,232,255,0.8); }

    .code-row { margin-top: 22px; display: flex; justify-content: center; }
    .code-input {
      background: rgba(77,232,255,0.04);
      border: none;
      border-bottom: 1px solid rgba(77,232,255,0.35);
      color: var(--cy);
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 2px;
      padding: 6px 4px;
      width: 220px;
      text-align: center;
      outline: none;
    }
    .code-input:focus { border-bottom-color: #fff; }
    .code-feedback { text-align: center; font-size: 10.5px; color: var(--text-muted); height: 16px; margin-top: 6px; opacity: 0; transition: opacity 0.3s ease; }
    .code-feedback.show { opacity: 1; }

    .help-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: transparent;
      color: #FF8A80;
      border: 1px solid var(--danger);
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      transition: background 0.15s ease;
      z-index: 10;
    }
    .help-btn:hover { background: rgba(197,0,14,0.12); }
    .help-btn:disabled { opacity: 0.6; cursor: default; }
    .help-btn.active { background: var(--danger); color: #fff; border-color: var(--danger); animation: helpPulseBtn 1.4s ease-in-out infinite; }
    .help-btn.pending { opacity: 0.55; }
    @keyframes helpPulseBtn {
      0%, 100% { box-shadow: 0 0 0 0 rgba(197,0,14,0.55); }
      50% { box-shadow: 0 0 0 9px rgba(197,0,14,0); }
    }
  </style>
  </head>
  <body>
    <button id="helpBtn" class="help-btn" type="button">Request Help</button>
    <div class="wrap">
      <div class="top-row">
        <div>
          <div class="title">SHERLOCK MATRIX</div>
          <div class="subtitle">SPATIAL RECONSTRUCTION &middot; LIVE</div>
        </div>
        <div class="target-readout">
          TARGET<br>
          <span class="target-val">X:2 &nbsp; Y:2</span>
        </div>
      </div>

      <div class="grid-cols">
        <div class="panel">
          <p class="panel-title">NODE MAP</p>
          <svg class="matrix-svg" viewBox="0 0 400 300" id="matrixSvg"></svg>
        </div>
        <div class="panel side-stack">
          <div>
            <p class="panel-title">SYSTEM</p>
            <div class="kv-row"><span>MODEL</span><span id="valModel">SHRLK-9</span></div>
            <div class="kv-row"><span>KERNEL</span><span id="valKernel">0x2F91</span></div>
            <div class="kv-row"><span>THREADS</span><span id="valThreads">128</span></div>
            <div class="kv-row"><span>SYNC</span><span id="valSync">--</span></div>
          </div>
          <div>
            <p class="panel-title">CURRENT STATUS</p>
            <div class="toggle-row"><span>RECON MODE</span><span class="toggle-pill on">ON</span></div>
            <div class="toggle-row"><span>MORATTI LOCK</span><span class="toggle-pill off">OFF</span></div>
            <div class="bars-row" id="barsRow"></div>
          </div>
        </div>
      </div>

      <div class="bottom-row">
        <div class="panel">
          <p class="panel-title">LOG</p>
          <ul class="log-list" id="logList"></ul>
        </div>
        <div class="panel">
          <p class="panel-title">SIGNAL STRENGTH</p>
          <div class="signal-pct" id="signalPct">93%</div>
          <svg class="signal-graph" viewBox="0 0 300 60" preserveAspectRatio="none"><polyline id="signalLine" fill="none" stroke="#4DE8FF" stroke-width="1.5" points=""></polyline></svg>
        </div>
      </div>

      <div class="code-row">
        <input type="text" class="code-input" id="codeInput" autocomplete="off" placeholder="&gt;">
      </div>
      <p class="code-feedback" id="codeFeedback">not valid</p>
    </div>

    <script>
      var API_URL = 'https://script.google.com/macros/s/AKfycbxc0QIIyaYTbGBMyhsUdYD01_AAYyrIsySqgF4rSWHPH8t73wHdP6iGEYUQMc5ImVsZ/exec';
      var team = sessionStorage.getItem('teamNumber');
      if (team) {
        fetch(API_URL, { method: 'POST', body: new URLSearchParams({ team: team, action: 'progress', page: '12', status: 'open' }) });
      }

      // --- Node map (8 points representing the room; one highlighted target) ---
      var svgNS = 'http://www.w3.org/2000/svg';
      var matrixSvg = document.getElementById('matrixSvg');
      var nodes = [
        { x: 1, y: 1 }, { x: 4, y: 1 }, { x: 1, y: 4 }, { x: 5, y: 3 },
        { x: 2, y: 2, target: true }, { x: 3, y: 5 }, { x: 5, y: 5 }, { x: 4, y: 4 }
      ];
      var pad = 40, cell = 55;
      function gx(x) { return pad + x * cell; }
      function gy(y) { return 260 - y * cell; }

      for (var gi = 0; gi <= 6; gi++) {
        var vLine = document.createElementNS(svgNS, 'line');
        vLine.setAttribute('class', 'grid-line');
        vLine.setAttribute('x1', gx(gi)); vLine.setAttribute('y1', gy(0));
        vLine.setAttribute('x2', gx(gi)); vLine.setAttribute('y2', gy(6));
        matrixSvg.appendChild(vLine);
        var hLine = document.createElementNS(svgNS, 'line');
        hLine.setAttribute('class', 'grid-line');
        hLine.setAttribute('x1', gx(0)); hLine.setAttribute('y1', gy(gi));
        hLine.setAttribute('x2', gx(6)); hLine.setAttribute('y2', gy(gi));
        matrixSvg.appendChild(hLine);
      }
      for (var li = 0; li <= 6; li++) {
        var lbl = document.createElementNS(svgNS, 'text');
        lbl.setAttribute('class', 'axis-label');
        lbl.setAttribute('x', gx(li) - 3);
        lbl.setAttribute('y', gy(0) + 14);
        lbl.textContent = li;
        matrixSvg.appendChild(lbl);
      }

      nodes.forEach(function (n) {
        var c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('class', 'node' + (n.target ? ' target' : ''));
        c.setAttribute('cx', gx(n.x));
        c.setAttribute('cy', gy(n.y));
        c.setAttribute('r', n.target ? 6 : 4);
        matrixSvg.appendChild(c);
        if (n.target) {
          var ring = document.createElementNS(svgNS, 'circle');
          ring.setAttribute('class', 'target-ring');
          ring.setAttribute('cx', gx(n.x));
          ring.setAttribute('cy', gy(n.y));
          ring.setAttribute('r', 10);
          matrixSvg.appendChild(ring);
        }
      });

      // --- Cosmetic animated readouts (no real meaning) ---
      function hex(n) { return '0x' + Math.floor(Math.random() * 65535).toString(16).toUpperCase().padStart(4, '0'); }
      setInterval(function () {
        document.getElementById('valKernel').textContent = hex();
        document.getElementById('valThreads').textContent = 96 + Math.floor(Math.random() * 64);
        document.getElementById('valSync').textContent = (Math.random() * 100).toFixed(1) + 'ms';
      }, 1400);

      var barsRow = document.getElementById('barsRow');
      var barEls = [];
      for (var b = 0; b < 24; b++) {
        var bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = (8 + Math.random() * 38) + 'px';
        barsRow.appendChild(bar);
        barEls.push(bar);
      }
      setInterval(function () {
        barEls.forEach(function (bar) {
          bar.style.height = (6 + Math.random() * 40) + 'px';
        });
      }, 550);

      var LOG_FRAGMENTS = [
        'sync buffer flush', 'node weight recalibrated', 'trace path resolved',
        'fragment checksum ok', 'listening on port 447', 'cache rebuilt',
        'thread pool scaled', 'heuristic pass complete', 'link table updated'
      ];
      var logList = document.getElementById('logList');
      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function addLog() {
        var now = new Date();
        var stamp = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
        var li = document.createElement('li');
        var frag = LOG_FRAGMENTS[Math.floor(Math.random() * LOG_FRAGMENTS.length)];
        li.innerHTML = '<span>' + stamp + '</span> ' + frag;
        logList.insertBefore(li, logList.firstChild);
        while (logList.children.length > 6) {
          logList.removeChild(logList.lastChild);
        }
      }
      addLog();
      setInterval(addLog, 1800);

      var signalPct = document.getElementById('signalPct');
      var signalLine = document.getElementById('signalLine');
      var signalPoints = [];
      for (var sp = 0; sp < 30; sp++) { signalPoints.push(20 + Math.random() * 20); }
      function drawSignal() {
        signalPoints.shift();
        signalPoints.push(10 + Math.random() * 40);
        var str = signalPoints.map(function (v, i) { return (i * 10) + ',' + (60 - v); }).join(' ');
        signalLine.setAttribute('points', str);
        signalPct.textContent = (86 + Math.floor(Math.random() * 13)) + '%';
      }
      drawSignal();
      setInterval(drawSignal, 700);

      // --- Codeword gate ---
      var CODE = 'mission control';
      var codeInput = document.getElementById('codeInput');
      var codeFeedback = document.getElementById('codeFeedback');
      var unlocked = false;

      function checkCode() {
        if (unlocked) return;
        var val = codeInput.value.trim().toLowerCase();
        if (!val) return;
        if (val === CODE) {
          unlocked = true;
          if (team) {
            fetch(API_URL, { method: 'POST', keepalive: true, body: new URLSearchParams({ team: team, action: 'progress', page: '12', status: 'done' }) });
          }
          setTimeout(function () {
            window.location.href = '13_Aufgabe03_Reconnect.html';
          }, 500);
        } else {
          codeFeedback.classList.add('show');
          codeInput.value = '';
          setTimeout(function () { codeFeedback.classList.remove('show'); }, 2200);
        }
      }
      codeInput.addEventListener('blur', checkCode);
      codeInput.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') checkCode();
      });

      var helpBtn = document.getElementById('helpBtn');
      function setHelpState(active) {
        if (!helpBtn) return;
        helpBtn.textContent = active ? 'Help Requested - Cancel' : 'Request Help';
        helpBtn.classList.toggle('active', !!active);
        helpBtn.classList.remove('pending');
      }
      if (team && helpBtn) {
        fetch(API_URL + '?t=' + Date.now())
          .then(function (res) { return res.json(); })
          .then(function (data) {
            var mine = (data.teams || []).filter(function (t) { return Number(t.team) === Number(team); })[0];
            setHelpState(mine && mine.hilfe_angefordert);
          });
        helpBtn.addEventListener('click', function () {
          var wasActive = helpBtn.classList.contains('active');
          helpBtn.disabled = true;
          helpBtn.classList.add('pending');
          helpBtn.textContent = wasActive ? 'Canceling...' : 'Requesting...';
          fetch(API_URL, { method: 'POST', body: new URLSearchParams({ team: team, action: 'help' }) })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data.status !== 'ok') {
                console.error('Help toggle failed:', data.message);
                setHelpState(wasActive);
                return;
              }
              setHelpState(data.hilfe_angefordert);
            })
            .catch(function (err) {
              console.error('Help toggle request failed:', err);
              setHelpState(wasActive);
            })
            .finally(function () { helpBtn.disabled = false; });
        });
      }
    </script>
  </body>
</html>
