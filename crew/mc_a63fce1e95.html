.chip{display:inline-flex;align-items:center;gap:12px;margin-top:26px;padding:8px 8px 8px 20px;border-radius:999px;
  background:rgba(0,0,0,.28);border:1px solid var(--line);font:600 13px/1.2 var(--font-head);color:var(--text-2);text-align:left}
.chip strong{display:block;font:700 16px var(--font-head);color:var(--text)}
.chip b{display:inline-grid;place-items:center;height:38px;padding:0 12px;border-radius:999px;background:var(--yellow);
  color:var(--petrol-900);font:800 13px var(--font-head);letter-spacing:.06em}

/* lock */
.lock{max-width:420px;margin:34px auto 60px;padding:22px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.lock h2{margin:0 0 6px;font:700 19px var(--font-head)}
.lock p{margin:0 0 16px;color:var(--text-2);font-size:14.5px}
.lock form{display:flex;gap:8px}
.lock input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:16px}
.lock input:focus{outline:2px solid var(--yellow);outline-offset:1px}
.lock button{border:0;border-radius:12px;padding:0 16px;background:var(--yellow);color:var(--petrol-900);font:700 15px var(--font-head);cursor:pointer}
.lock .err{color:var(--red);font-size:14px;margin:10px 0 0;min-height:1.2em}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:rgba(3,34,42,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:8px;padding-bottom:8px}
.tab{border:1px solid transparent;background:transparent;border-radius:12px;padding:9px 4px;cursor:pointer;font:700 15px var(--font-head);color:var(--text-2)}
.tab[aria-selected="true"]{background:var(--card);border-color:var(--line);color:var(--text);box-shadow:inset 0 -3px 0 var(--yellow)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:720px;margin:0 auto;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;font:700 13px var(--font-head);color:var(--text-2);padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card-2)}
.jump a.sec{color:var(--yellow-soft);border-color:rgba(255,230,128,.4)}
.jump[hidden]{display:none}
section[hidden]{display:none}

/* code card */
.codecard{margin:24px 0 8px;padding:18px 18px 16px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(255,210,0,.16),rgba(255,210,0,.05));border:1px solid rgba(255,210,0,.45)}
.codecard .k{font:700 12px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-soft)}
.codecard .digits{display:flex;gap:8px;margin:10px 0 12px}
.codecard .d{flex:1;max-width:72px;text-align:center;padding:8px 0 6px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.codecard .d strong{display:block;font:800 30px var(--font-head);color:var(--yellow);line-height:1.1}
.codecard .d small{display:block;font:600 11px var(--font-head);color:var(--text-3);margin-top:2px}
.codecard p{margin:0;color:var(--text-2);font-size:14px}

/* sections & pages */
h2.sec{font:800 13px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-soft);margin:34px 0 12px}
.pg{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 12px;margin:0 0 12px}
.pg-h{display:flex;align-items:baseline;gap:10px}
.pg-h .no{flex:none;display:inline-grid;place-items:center;min-width:38px;height:28px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);font:800 14px var(--font-head)}
.pg-h h3{margin:0;font:700 17px/1.25 var(--font-head)}
.sol{margin:12px 0 4px;padding:11px 13px;border-radius:12px;background:rgba(255,210,0,.1);border:1px solid rgba(255,210,0,.35)}
.sol .lbl{font:700 11px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--yellow-soft);margin-bottom:4px}
.sol .big{font:800 22px/1.2 var(--font-head);color:var(--yellow);word-break:break-word}
.sol .sub{color:var(--text-2);font-size:14px;margin-top:4px}
.sol ol,.sol ul{margin:2px 0 0;padding-left:20px}
.sol li{margin:3px 0;font-size:14.5px}
.sol li b{color:var(--yellow)}
.sol.none{background:var(--card-2);border-color:var(--line)}
.sol.none .big{font:600 15px/1.35 var(--font-body);color:var(--text-2)}
details{margin-top:8px;border-top:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:9px 0 3px;font:700 13px var(--font-head);color:var(--text-2)}
summary::-webkit-details-marker{display:none}
summary:before{content:"›";display:inline-block;width:14px;transition:transform .15s}
details[open] summary:before{transform:rotate(90deg)}
details p{overflow-wrap:anywhere;margin:4px 0 6px 14px;color:var(--text-2);font-size:14px}
.file{display:block;margin:4px 0 4px 14px;color:var(--text-3);font-size:12.5px;word-break:break-all}

/* teams */
.mc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin:0 0 12px}
.mc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mc h3{margin:0;font:800 19px var(--font-head)}
.floor{font:700 13px var(--font-head);color:var(--petrol-900);background:var(--yellow);padding:4px 10px;border-radius:999px}
.crew{margin:6px 0 10px;color:var(--text-2);font-size:14.5px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.tl li b{font:700 14.5px var(--font-head)}
.tl li span{color:var(--text-2);text-align:right}
.tag{font:600 11px var(--font-head);color:var(--text-3);margin-left:6px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 0 14px 44px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;background:var(--yellow);color:var(--petrol-900);font:800 14px var(--font-head)}
.steps b{display:block;font:700 15px var(--font-head);margin-bottom:2px}
.steps p{margin:0;color:var(--text-2);font-size:14.5px}

/* guide */
.gd{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;margin:0 0 10px}
.gd h3{margin:0 0 4px;font:700 16px var(--font-head)}
.gd p,.gd li,.sol li,.sol .sub{overflow-wrap:anywhere}
.gd p{margin:4px 0 0;color:var(--text-2);font-size:14.5px}
.gd ol,.gd ul{margin:4px 0 0;padding-left:20px;color:var(--text-2);font-size:14.5px}
.gd li{margin:3px 0}
.gd.warn{border-color:rgba(255,122,107,.5);background:rgba(255,122,107,.08)}
.gd.warn h3{color:var(--red)}
.intro{margin:24px 0 0;color:var(--text-2);font-size:14.5px}
footer{text-align:center;color:var(--text-3);font-size:12.5px;padding:40px 16px 110px}
footer strong{display:block;font:800 18px var(--font-head);color:var(--text);margin-bottom:2px}
footer button{margin-top:14px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font:600 12px var(--font-head);color:var(--text-3);cursor:pointer}
</style>
</head>

const KEY = "jd26-mc";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(pw, remember){
  try{
    const data = await decrypt(pw);
    if (remember){ try{ localStorage.setItem(KEY, pw); }catch(e){} }
    render(data); $("#lock").hidden = true; $("#app").hidden = false;
    return true;
  }catch(e){ return false; }
}
$("#lockform").addEventListener("submit", async ev => {
  ev.preventDefault(); $("#err").textContent = "";
  const ok = await unlock($("#pw").value.trim(), true);
  if (!ok) $("#err").textContent = "Das Passwort stimmt nicht.";
});
$("#logout").addEventListener("click", () => { try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); });
(async () => { let pw = null; try{ pw = localStorage.getItem(KEY); }catch(e){} if (pw && !(await unlock(pw, false))) { try{ localStorage.removeItem(KEY); }catch(e){} } })();

/* ---------- rendering ---------- */
const lines = s => s.split("\n").map(x => x.trim()).filter(Boolean);
function solHTML(p){
  const L = lines(p.sol);
  if (/^Keine Eingabe/.test(L[0])) return `<div class="sol none"><div class="lbl">Lösung</div><div class="big">${L.map(esc).join("<br>")}</div></div>`;
  if (L.length > 2){
    const items = L.map(l => { const m = l.match(/^([^–:→]+?)\s*(–|:|→)\s*(.+)$/);
      return m ? `<li><b>${esc(m[1])}</b> ${m[2] === "–" ? "–" : m[2]} ${esc(m[3])}</li>` : `<li>${esc(l)}</li>`; }).join("");
    return `<div class="sol"><div class="lbl">Lösung</div><ul>${items}</ul></div>`;
  }
  return `<div class="sol"><div class="lbl">Lösung</div><div class="big">${esc(L[0])}</div>${L[1] ? `<div class="sub">${esc(L[1])}</div>` : ""}</div>`;
}
function textHTML(s){
  const L = lines(s);
  if (L.length > 1 && L.every(l => /^\d+\.\s/.test(l))) return `<ol>${L.map(l => `<li>${esc(l.replace(/^\d+\.\s*/, ""))}</li>`).join("")}</ol>`;
  return L.map(l => `<p>${esc(l)}</p>`).join("");
}
function render(D){
  $("#stand").textContent = D.stand;
  // solutions
  let h = `<p class="intro">${esc(D.intro)}</p>`;
  if (D.code) h += `<div class="codecard"><div class="k">Schließfach-Code · für alle 16 Teams gleich</div>
    <div class="digits">${D.code.digits.map(d => `<div class="d"><strong>${esc(d.v)}</strong><small>${esc(d.src)}</small></div>`).join("")}</div>
    <p>${esc(D.code.note)}</p></div>`;
  let jump = "";
  D.sections.forEach((s, i) => {
    const short = s.title.split(" – ")[0];
    jump += `<a class="sec" href="#s${i}">${esc(short)}</a>`;
    h += `<h2 class="sec" id="s${i}">${esc(s.title)}</h2>`;
    s.pages.forEach(p => {
      jump += `<a href="#p${p.no}">${esc(p.no)}</a>`;
      h += `<article class="pg" id="p${p.no}"><div class="pg-h"><span class="no">${esc(p.no)}</span><h3>${esc(p.name)}</h3></div>
        ${solHTML(p)}
        ${p.tips ? `<details open><summary>Hilfe-Tipps</summary>${textHTML(p.tips)}</details>` : ""}
        <details><summary>Was auf der Seite passiert</summary>${textHTML(p.what)}<span class="file">${esc(p.file)}</span></details></article>`;
    });
  });
  $("#sol").innerHTML = h; $("#jump").innerHTML = jump;
  // teams
  let t = `<h2 class="sec">Die vier Mission Controls</h2>`;
  D.mc.forEach(m => {
    t += `<article class="mc"><div class="mc-h"><h3>${esc(m.name)}</h3><span class="floor">${esc(m.garden)}</span></div>
      <div class="crew">${m.crew.map(esc).join(" · ")}</div><ul class="tl">${m.teams.map(x => {
        const k = x.match(/^(Team \d+)\s*\((\w+)\)\s*–\s*Raum\s*(.+)$/);
        return k ? `<li><b>${esc(k[1])}<span class="tag">${esc(k[2])}</span></b><span>${esc(k[3])}</span></li>` : `<li>${esc(x)}</li>`; }).join("")}</ul></article>`;
  });
  t += `<h2 class="sec">Ablauf Field Agents und 3. Ziffer</h2><ol class="steps">${D.fa_steps.map(s =>
        `<li><b>${esc(s.t.replace(/^\d+\s*·\s*/, ""))}</b><p>${esc(s.x)}</p></li>`).join("")}</ol>`;
  $("#teams").innerHTML = t;
  // guide
  let g = `<h2 class="sec">Anleitung für die Mission Controls</h2>`;
  D.guide.forEach(x => g += `<article class="gd${x.t === "Vorsicht" ? " warn" : ""}"><h3>${esc(x.t)}</h3>${textHTML(x.x)}</article>`);
  g += `<h2 class="sec">Wichtige Hinweise</h2>`;
  D.notes.filter(x => x.t !== "Stand").forEach(x => g += `<article class="gd"><h3>${esc(x.t)}</h3>${textHTML(x.x)}</article>`);
  $("#guide").innerHTML = g;
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
    ["sol","teams","guide"].forEach(id => $("#" + id).hidden = id !== b.dataset.tab);
    $("#jump").hidden = b.dataset.tab !== "sol"; window.scrollTo({top: $(".tabs").offsetTop, behavior: "instant"});
  }));
}
</script>
</body>
</html>
