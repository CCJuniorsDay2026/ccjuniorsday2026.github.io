<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protocol 16 – Reconnect Sherlock</title>
<style>
  :root {
    --bg: #002E3C;
    --bg-deep: #001B24;
    --accent: #FFD700;
    --text: #F1EFED;
    --text-muted: #A0AEAC;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 32%, #0a4457 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .stage { text-align: center; max-width: 420px; }
  .logo-mark {
    width: 96px;
    height: 96px;
    margin: 0 auto 48px;
  }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(255,215,0,0.55)); }
    50% { filter: drop-shadow(0 0 28px rgba(255,215,0,0.9)); }
  }
  .wordmark {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--text);
    margin-bottom: 40px;
  }
  .protocol-label {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }
  h1 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 48px;
    color: var(--text);
  }
  .sub {
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.6;
    margin: 0;
  }
  a.enter {
    display: inline-block;
    padding: 14px 36px;
    background: var(--accent);
    color: #1A1500;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    text-decoration: none;
    border-radius: 999px;
    transition: transform 0.15s ease;
  }
  a.enter:hover { transform: scale(1.04); }
</style>
</head>
