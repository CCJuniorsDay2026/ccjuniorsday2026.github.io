<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase Setup</title>
<style>
  :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --ok: #3fb950; --fail: #f85149; --accent: #FFD700; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Arial, sans-serif; padding: 32px 20px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
  .warn { background: rgba(210,153,34,0.12); border: 1px solid #d29922; color: #e3b341; border-radius: 8px; padding: 12px 16px; font-size: 13.5px; margin-bottom: 24px; }
  button { background: var(--accent); color: #1A1500; border: none; border-radius: 999px; padding: 12px 28px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .log { margin-top: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; font-family: "SF Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; min-height: 40px; }
  .log .ok { color: var(--ok); }
  .log .fail { color: var(--fail); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Firebase Setup</h1>
  <p class="sub">Legt die 16 Team-Dokumente und die Mission-Einstellungen einmalig in Firestore an. Nur einmal ausführen (setzt bestehende Daten zurück, falls schon mal gelaufen).</p>
  <div class="warn">Läuft direkt gegen die Live-Datenbank. Danach diese Seite nicht mehr nötig.</div>
  <button id="runBtn" type="button">Datenbank initialisieren</button>
  <div class="log" id="log"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDJfW69cVuCN7zNnAXJqIUUd9DPjq7gk_A",
    authDomain: "protocol16.firebaseapp.com",
    projectId: "protocol16",
    storageBucket: "protocol16.firebasestorage.app",
    messagingSenderId: "1029357758272",
    appId: "1:1029357758272:web:9f5d5f076fc23d40967ca5"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var logEl = document.getElementById('log');
  var btn = document.getElementById('runBtn');

  function log(msg, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    logEl.innerHTML = '';
    log('Starte...');

    var batch = db.batch();
    for (var i = 1; i <= 16; i++) {
      var ref = db.collection('teams').doc(String(i));
      batch.set(ref, {
        team: i,
        raum: null,
        sprache: null,
        mission_control: null,
        locked_in_at: null,
        last_update: null,
        hilfe_angefordert: null,
        progress: {}
      });
    }
    batch.set(db.collection('mission_settings').doc('config'), { start_time: null });

    batch.commit()
      .then(function () {
        log('16 Teams + Einstellungen angelegt.', 'ok');
        log('Fertig. Diese Seite kannst du jetzt schließen.', 'ok');
      })
      .catch(function (err) {
        log('Fehler: ' + err.message, 'fail');
        btn.disabled = false;
      });
  });
</script>
</body>
</html>
